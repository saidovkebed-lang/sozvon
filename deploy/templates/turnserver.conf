# Созвон — coturn (TURN/STUN для голоса и видео).
# Файл создан deploy/install.sh, при повторной установке перезаписывается.

listening-port=@TURN_PORT@
tls-listening-port=@TURNS_PORT@
# Публичный адрес сервера (в облаке с NAT: "публичный/внутренний")
external-ip=@EXTERNAL_IP@
@RELAY_IP_LINE@
# Порты для медиатрафика (UDP) — должны быть открыты в файрволе
min-port=@RELAY_MIN_PORT@
max-port=@RELAY_MAX_PORT@

realm=@DOMAIN@
server-name=@DOMAIN@
fingerprint

# Временные учётки (TURN REST API): сервер Созвона выдаёт их на 24 часа,
# подписывая HMAC-SHA1 этим секретом (TURN_SECRET в /etc/sozvon.env).
use-auth-secret
static-auth-secret=@TURN_SECRET@

# TLS (turns:) — сертификат Let's Encrypt, копию кладёт deploy-hook certbot
cert=@TURN_CERT@
pkey=@TURN_PKEY@
no-tlsv1
no-tlsv1_1

# Ограничения
total-quota=800
stale-nonce=600
no-cli
no-multicast-peers
# WebRTC использует только UDP-relay; TCP-relay (RFC 6062) не нужен и расширяет поверхность атаки
no-tcp-relay
no-software-attribute

# Логи в journald/syslog
syslog
simple-log

# Защита от SSRF: TURN не должен пускать к внутренним сетям сервера и облака
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
