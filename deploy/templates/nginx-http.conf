# Созвон — nginx, этап 1 (только HTTP, до получения сертификата).
# Файл создан deploy/install.sh, при повторной установке перезаписывается.
map $http_upgrade $sozvon_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
@LISTEN6_80@
    server_name @DOMAIN@;

    # Проверка Let's Encrypt (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root @ACME_ROOT@;
        default_type text/plain;
    }

    location / {
        return 503 "Созвон устанавливается: сертификат HTTPS ещё не получен.\n";
        default_type "text/plain; charset=utf-8";
    }
}
