# Созвон — nginx (HTTPS → Node.js на 127.0.0.1:@APP_PORT@).
# Файл создан deploy/install.sh, при повторной установке перезаписывается.
map $http_upgrade $sozvon_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
@LISTEN6_80@
    server_name @DOMAIN@;

    location ^~ /.well-known/acme-challenge/ {
        root @ACME_ROOT@;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
@LISTEN6_443@
    server_name @DOMAIN@;

    ssl_certificate     @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sozvon_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Вложения до 100 МБ (UPLOAD_LIMIT_MB) + запас на multipart; музыка до 50 МБ.
    # deploy/update.sh перерисовывает этот файл при обновлении.
    client_max_body_size 110m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Кэш не держим: заголовки (в т.ч. Cache-Control для /sw.js и тип .webmanifest) задаёт Node/Express

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $sozvon_connection_upgrade;

    # Socket.IO (WebSocket): длинные соединения
    location /socket.io/ {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Загрузка файлов сразу в Node, без промежуточного буфера на диске nginx
        proxy_request_buffering off;
    }
}
