
# --- Музыка (подробно: docs/MUSIC.md) -----------------------------------------
# Раскомментируйте нужное и перезапустите: sudo systemctl restart sozvon sozvon-bot
# Проверка, что YouTube/SoundCloud/Spotify доступны с сервера: sudo bash /opt/sozvon/deploy/music-check.sh
#
# Файл cookies YouTube (формат Netscape cookies.txt) — если YouTube пишет «подтвердите, что вы не бот».
# Положите файл в /var/lib/sozvon и сделайте владельцем sozvon: chown sozvon: /var/lib/sozvon/cookies.txt
#YTDLP_COOKIES=/var/lib/sozvon/cookies.txt
#
# Прокси только для скачивания музыки (http://, https:// или socks5://логин:пароль@хост:порт)
#YTDLP_PROXY=socks5://127.0.0.1:1080
#
# Максимум секунд на скачивание одного трека / на поиск и чтение плейлиста
#YTDLP_TIMEOUT_SEC=300
#YTDLP_META_TIMEOUT_SEC=90
#
# Где искать треки по названию и треки из Spotify (по порядку): youtube, soundcloud
#MUSIC_SEARCH_SOURCES=youtube,soundcloud
#
# Сколько треков брать из одного плейлиста
#MUSIC_PLAYLIST_LIMIT=100
#
# Допуск по длительности при поиске треков из Spotify, секунд
#MUSIC_DURATION_TOLERANCE=15
#
# Ключи Spotify Web API (необязательно; без них берётся публичная embed-страница, ~100 первых треков)
#SPOTIFY_CLIENT_ID=
#SPOTIFY_CLIENT_SECRET=
#
# Если open.spotify.com недоступен с сервера напрямую — Spotify через HTTP(S)-прокси (Node ≥ 22.21):
#NODE_USE_ENV_PROXY=1
#HTTPS_PROXY=http://логин:пароль@хост:3128
#NO_PROXY=localhost,127.0.0.1
