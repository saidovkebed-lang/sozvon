# Сборка «Созвон для ПК» и публикация релиза.
# Запуск: пуш тега вида desktop-v1.0.0 (версия берётся из desktop/package.json).
# Сервер (deploy/update.sh → deploy/app-release.sh) сам скачает файлы релиза к себе
# и будет раздавать их на /download — друзьям из РФ не нужен доступ к GitHub.
name: desktop-release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              desktop/dist/*.exe
              desktop/dist/*.zip
              desktop/dist/*.blockmap
              desktop/dist/latest.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      # Помощник захвата экрана (DXGI Desktop Duplication — не прячет курсор в играх). Статический CRT (/MT):
      # не нужен Visual C++ Redistributable. Проверка — тут же, на настоящей Windows раннера.
      - name: sozvon-capture.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          New-Item -ItemType Directory -Force native\capture\build | Out-Null
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /MT /EHsc /std:c++20 /utf-8 /W3 native\capture\capture.cpp /Fonative\capture\build\ /Fenative\capture\build\sozvon-capture.exe /link /SUBSYSTEM:CONSOLE"
          if (!(Test-Path native\capture\build\sozvon-capture.exe)) { throw 'sozvon-capture.exe не собрался' }
      - name: Проверка sozvon-capture.exe
        if: runner.os == 'Windows'
        run: node scripts/capture-smoke.cjs
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Тег релиза
        id: tag
        run: echo "tag=desktop-v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Созвон для ПК ${{ steps.tag.outputs.tag }}
          body_path: desktop/RELEASE_NOTES.md
          files: out/*
          fail_on_unmatched_files: true
