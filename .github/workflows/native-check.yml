# Проверка помощника sozvon-capture.exe на настоящей Windows (без сборки и публикации приложения).
# Запуск: вручную (workflow_dispatch) или пуш в ветку native-*. Сборка — та же строка cl, что в desktop-release.yml.
name: native-check

on:
  workflow_dispatch:
  push:
    branches: ['native-*']

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sozvon-capture.exe
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          New-Item -ItemType Directory -Force native\capture\build | Out-Null
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /MT /EHsc /std:c++20 /utf-8 /W3 native\capture\capture.cpp /Fonative\capture\build\ /Fenative\capture\build\sozvon-capture.exe /link /SUBSYSTEM:CONSOLE"
          if (!(Test-Path native\capture\build\sozvon-capture.exe)) { throw 'sozvon-capture.exe не собрался' }
      - name: Проверка sozvon-capture.exe
        run: node scripts/capture-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: sozvon-capture
          path: desktop/native/capture/build/sozvon-capture.exe
          if-no-files-found: error
