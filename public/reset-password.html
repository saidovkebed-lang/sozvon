<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0e21">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Сброс пароля — Astra</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/astra2.css">
</head>
<body>
  <!-- Сброс пароля по одноразовой ссылке из Telegram-бота (server/pwreset.js). Токен — во фрагменте #t=… -->
  <section class="auth" id="reset-screen">
    <div class="auth__card">
      <img class="auth__logo" src="/assets/logo.svg" alt="Astra" width="64" height="64">
      <h1 class="auth__title" id="reset-title">Новый пароль</h1>
      <p class="auth__subtitle" id="reset-subtitle">Проверяем ссылку…</p>
      <form id="reset-form" class="form" novalidate hidden>
        <div class="field">
          <label class="field__label" for="reset-password">Новый пароль</label>
          <input class="input" id="reset-password" type="password" autocomplete="new-password" minlength="4" maxlength="128" required>
        </div>
        <div class="field">
          <label class="field__label" for="reset-password2">Повторите пароль</label>
          <input class="input" id="reset-password2" type="password" autocomplete="new-password" minlength="4" maxlength="128" required>
        </div>
        <div class="field" id="reset-code-field" hidden>
          <label class="field__label" for="reset-code">Код из приложения-аутентификатора или код восстановления</label>
          <input class="input" id="reset-code" type="text" inputmode="text" autocomplete="one-time-code" maxlength="12" spellcheck="false" autocapitalize="off">
        </div>
        <p class="form__error" id="reset-error" role="alert"></p>
        <button class="btn btn--primary btn--block" id="reset-submit" type="submit">Сменить пароль</button>
        <p class="auth__hint">После смены пароля все сеансы на всех устройствах будут завершены.</p>
      </form>
      <div id="reset-done" hidden>
        <p class="auth__hint" id="reset-done-text"></p>
        <a class="btn btn--primary btn--block" id="reset-login" href="/">Войти</a>
      </div>
    </div>
  </section>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
